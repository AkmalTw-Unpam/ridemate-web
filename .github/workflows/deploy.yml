name: Terbitkan situs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pasang paket
        run: npm install

      - name: Bangun situs
        run: npm run build

      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      - name: Unggah hasil build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  terbitkan:
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.penerbitan.outputs.page_url }}
    steps:
      - name: Terbitkan
        id: penerbitan
        uses: actions/deploy-pages@v4
