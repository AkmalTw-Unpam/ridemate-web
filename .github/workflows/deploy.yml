####################################################################
# Membangun dan menerbitkan situs RideMate ke GitHub Pages
#
# KENAPA ADA BERKAS INI
#
# Yang kamu unggah ke repo ini adalah kode sumber: berkas .tsx, .ts,
# dan .css. Peramban tidak mengerti satu pun dari itu — ia hanya
# mengerti .html, .js, dan .css biasa. Jadi kode sumbernya harus
# "dibangun" dulu menjadi berkas yang dimengerti peramban.
#
# Biasanya itu dikerjakan di laptop dengan `npm run build`, lalu
# hasilnya di folder dist/ diunggah. Artinya kamu harus memasang
# Node.js, dan harus ingat membangun ulang setiap kali ada perubahan
# — dan kalau lupa, situsnya diam-diam menampilkan versi lama.
#
# Berkas ini memindahkan pekerjaan itu ke komputer GitHub. Setiap kali
# kamu menyimpan perubahan ke cabang main, GitHub memasang Node,
# membangun situsnya, dan menerbitkan hasilnya. Kamu tidak perlu
# memasang apa pun.
#
# YANG HARUS DINYALAKAN SEKALI, DI SETELAN REPO
#
#   Settings -> Pages -> Build and deployment -> Source
#   Pilih "GitHub Actions", BUKAN "Deploy from a branch".
#
# Tanpa itu, berkas ini jalan tapi hasilnya tidak diterbitkan.
####################################################################

name: Terbitkan situs

on:
  push:
    branches: [main]
  # Supaya bisa dijalankan manual dari tab Actions tanpa perlu
  # mengubah apa pun — berguna kalau sertifikat atau domain baru
  # diatur dan situsnya perlu diterbitkan ulang.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Kalau dua unggahan berdekatan, biarkan keduanya selesai berurutan.
# cancel-in-progress sengaja false: membatalkan penerbitan di
# tengah jalan bisa meninggalkan situs dalam keadaan separuh.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm install`, bukan `npm ci`, karena repo ini sengaja tidak
      # menyertakan package-lock.json. Kalau nanti kamu pernah
      # menjalankan `npm install` di laptop, lock-nya akan ikut
      # tersimpan — saat itu baris ini boleh diganti `npm ci`, yang
      # lebih cepat dan lebih pasti.
      - name: Pasang paket
        run: npm install

      - name: Bangun situs
        run: npm run build

      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      - name: Unggah hasil build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  terbitkan:
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.penerbitan.outputs.page_url }}
    steps:
      - name: Terbitkan
        id: penerbitan
        uses: actions/deploy-pages@v4
